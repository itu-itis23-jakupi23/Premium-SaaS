<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Booth Render</title>
<style>
  :root {
    --bg-top:    #eef0f2;
    --bg-bot:    #c9ccd0;
    --ink:       #1a1d22;
    --ink-dim:   #6b7079;
    --line:      rgba(20,22,26,0.10);
    --card-bg:   rgba(255,255,255,0.78);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face {
    font-family: "SamsungOne";
    src:
      local("SamsungOne"),
      local("SamsungOne UI"),
      local("SamsungOneKorean"),
      local("Samsung Sharp Sans");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  html, body { height: 100%; overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    font: 12px/1.4 "SamsungOne", "Samsung One", "SamsungOne UI", "SamsungOneKorean", "Samsung Sharp Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: fixed; inset: 0; }
  svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  svg.drop-preview-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 14; pointer-events: none; animation: none; }
  #glbCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 12; transform-origin: center center; }

  @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
  svg.scene { animation: sceneIn .9s ease-out; }
  @keyframes hudIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .hud > * { animation: hudIn .5s ease-out backwards; }
  .hud.bl > *:nth-child(1) { animation-delay: 0.4s; }
  .hud.bl > *:nth-child(2) { animation-delay: 0.45s; }
  .hud.br > * { animation-delay: 0.5s; }
  .hud.tr > * { animation-delay: 0.55s; }

  .hud { position: absolute; pointer-events: none; z-index: 20; }
  .hud > * { pointer-events: auto; }
  .hud.tr { top: 18px; right: 18px; display: flex; gap: 8px; }
  .hud.bl { left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
  .hud.br { right: 18px; bottom: 18px; display: flex; gap: 8px; align-items: flex-end; }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(20,22,26,0.04), 0 12px 32px rgba(20,22,26,0.08);
    padding: 9px 12px;
    color: var(--ink);
  }
  .card .k { color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 9.5px; font-weight: 500; }
  .card .v { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 500; }
  .card .row { display: flex; align-items: center; gap: 8px; }
  .card .sep { width: 1px; height: 11px; background: var(--line); }

  .toolbar { padding: 4px; display: flex; gap: 2px; }
  .toolbar button {
    width: 28px; height: 28px; border: 0; background: transparent;
    color: var(--ink-dim); border-radius: 5px; cursor: pointer;
    display: grid; place-items: center;
    transition: background .12s, color .12s;
  }
  .toolbar button:hover { background: rgba(20,22,26,0.05); color: var(--ink); }
  .toolbar button.active { background: rgba(20,22,26,0.08); color: var(--ink); }
  .toolbar button svg { width: 14px; height: 14px; stroke-width: 1.6; }
  .toolbar .div { width: 1px; height: 18px; background: var(--line); margin: 0 2px; align-self: center; }

  .meta-title {
    font-size: 12px; font-weight: 600; letter-spacing: -0.005em;
    display: flex; align-items: center; gap: 8px;
  }
  .meta-title .pill {
    font-size: 9.5px; padding: 2px 6px; border-radius: 4px;
    background: rgba(20,22,26,0.06); color: var(--ink-dim); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  .ruler {
    position: absolute; bottom: 96px; right: 24px;
    display: flex; align-items: center; gap: 6px;
    color: var(--ink-dim); font-size: 10px;
    animation: hudIn .5s ease-out 0.6s backwards;
  }
  .ruler .bar { width: 88px; height: 1.5px; background: var(--ink); position: relative; opacity: 0.6; }
  .ruler .bar::before, .ruler .bar::after {
    content: ''; position: absolute; top: -3px; width: 1px; height: 7px; background: var(--ink); opacity: 0.7;
  }
  .ruler .bar::before { left: 0; } .ruler .bar::after { right: 0; }

  .ann { position: absolute; pointer-events: none; font-size: 10px;
    color: var(--ink-dim); letter-spacing: 0.04em;
    animation: hudIn .5s ease-out 0.7s backwards;
  }
  .ann .lbl {
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 4px;
    font-variant-numeric: tabular-nums; font-weight: 500;
    color: var(--ink);
  }

  svg.scene polygon[data-pid] { cursor: pointer; }
  svg.scene polygon[data-pid]:hover { filter: brightness(1.05); }
  #floorGroup > :not([data-pid]), #gridGroup { pointer-events: none; }

  .crumb {
    font-size: 11px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .crumb b { color: var(--ink); font-weight: 600; }
  .crumb .sep { opacity: 0.4; }

  .info-line { display: flex; gap: 14px; align-items: center; }
</style>
</head>
<body>
<div class="stage">

  <svg class="scene" id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#dde0e5"/>
        <stop offset="60%" stop-color="#bcc1c8"/>
        <stop offset="100%" stop-color="#979da5"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bcbfc4"/>
        <stop offset="50%" stop-color="#ced1d5"/>
        <stop offset="100%" stop-color="#dfe1e4"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#eef0f2"/>
      </linearGradient>
      <linearGradient id="panel-side" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f6f7f9"/>
        <stop offset="100%" stop-color="#dadde1"/>
      </linearGradient>
      <linearGradient id="panel-shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#dee0e3"/>
        <stop offset="100%" stop-color="#b5b8bd"/>
      </linearGradient>
      <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#8e9298"/>
        <stop offset="30%" stop-color="#c8ccd0"/>
        <stop offset="55%" stop-color="#dfe2e6"/>
        <stop offset="80%" stop-color="#a4a8ae"/>
        <stop offset="100%" stop-color="#7a7e84"/>
      </linearGradient>
      <linearGradient id="alu-h" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d8dbdf"/>
        <stop offset="45%" stop-color="#bfc3c8"/>
        <stop offset="100%" stop-color="#8c9097"/>
      </linearGradient>
      <linearGradient id="alu-cap" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e2e5e8"/>
        <stop offset="100%" stop-color="#a8acb1"/>
      </linearGradient>
      <linearGradient id="fascia" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fbfcfd"/>
        <stop offset="100%" stop-color="#e6e8eb"/>
      </linearGradient>
      <pattern id="tile" x="0" y="0" width="180" height="180" patternUnits="userSpaceOnUse">
        <rect width="180" height="180" fill="none"/>
        <line x1="0" y1="0" x2="180" y2="0" stroke="rgba(20,22,26,0.07)" stroke-width="0.7"/>
        <line x1="0" y1="0" x2="0" y2="180" stroke="rgba(20,22,26,0.07)" stroke-width="0.7"/>
      </pattern>
      <filter id="ground-shadow" x="-25%" y="-60%" width="150%" height="220%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="9" />
      </filter>
      <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="rgba(20,22,26,0.35)"/>
        <stop offset="65%" stop-color="rgba(20,22,26,0.08)"/>
        <stop offset="100%" stop-color="rgba(20,22,26,0)"/>
      </radialGradient>
      <linearGradient id="reflect-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(0,0,0,0.20)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </linearGradient>
      <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
        <stop offset="65%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
      </radialGradient>
      <filter id="blur-soft" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur stdDeviation="2.2"/>
      </filter>
      <clipPath id="carpet-clip">
        <polygon id="carpet-clip-poly" points="0,0"/>
      </clipPath>
    </defs>

    <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>
    <g id="floorGroup"></g>
    <g id="boothGroup"></g>
    <g id="gridGroup" clip-path="url(#carpet-clip)"></g>
    <rect x="0" y="0" width="1600" height="1000" fill="url(#vignette)" pointer-events="none"/>
  </svg>
  <canvas id="glbCanvas"></canvas>
  <svg class="drop-preview-scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g id="catalogDropGroup"></g>
  </svg>

  <div class="hud tr">
    <div class="card toolbar" id="view-toolbar">
      <button data-view="front" title="Front">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21l9-5 9 5M3 21V9l9-5 9 5v12"/></svg>
      </button>
      <button class="active" data-view="3q" title="3/4 view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
      </button>
      <button data-view="side" title="Side">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="5" width="16" height="14"/><path d="M4 9h16"/></svg>
      </button>
      <button data-view="top" title="Top plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16"/><path d="M4 9h16M9 4v16"/></svg>
      </button>
      <span class="div"></span>
      <button id="btn-reset" title="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <div class="card toolbar" id="profile-toolbar" title="Column profile">
      <button data-prof="maxima" title="Maxima · square 40×40">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="6" width="12" height="12" rx="0.5"/><path d="M12 6v12M6 12h12" opacity="0.45"/></svg>
      </button>
      <button data-prof="octa" title="Octanorm · Ø40 / 8 grooves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="6"/><path d="M12 6v12M6 12h12M7.76 7.76l8.48 8.48M16.24 7.76l-8.48 8.48" opacity="0.45"/></svg>
      </button>
    </div>
  </div>

  <div class="hud bl">
    <div class="card" style="padding: 6px 10px; border-radius: 6px;">
      <div class="meta-title" style="font-size: 11px; gap: 6px;">
        <span id="hud-system">Octanorm</span>
        <span class="pill" id="hud-type" style="font-size: 8.5px; padding: 1.5px 5px; border-radius: 3px;">Stand</span>
      </div>
      <div class="crumb" style="margin-top: 4px; font-size: 10px;">
        <span id="hud-dims">6.0 × 3.0 m</span>
        <span class="sep">·</span>
        <span id="hud-height">2.50 m total</span>
        <span class="sep">·</span>
        <span>40 mm profile</span>
      </div>
    </div>
  </div>

  <div class="hud br">
    <div class="card" id="sel-card" style="display:none; min-width:200px;">
      <div class="k">selected component</div>
      <div id="sel-label" style="font-size:12px; font-weight:600; margin-top:4px;">—</div>
      <div id="sel-meta" style="font-size:10px; color:var(--ink-dim); margin-top:2px;">—</div>
    </div>
  </div>

  <div class="ruler">
    <span>scale</span>
    <div class="bar"></div>
    <span>1.0 m</span>
  </div>

  <div class="ann" id="dim-w"><div class="lbl">6.0 m</div></div>
  <div class="ann" id="dim-d"><div class="lbl">3.0 m</div></div>
  <div class="ann" id="dim-h"><div class="lbl">2.5 m</div></div>
</div>

<script src="/booth-render.js"></script>
<script type="module">
import * as THREE from '/src/workspace/three-proxy.ts';
import { GLTFLoader } from '/src/workspace/gltf-loader-proxy.ts';
import { MeshoptDecoder } from '/src/workspace/meshopt-decoder-proxy.ts';

const canvas = document.getElementById('glbCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
const loader = new GLTFLoader();
// Enables loading meshopt-compressed GLBs (EXT_meshopt_compression). The decoder
// is only invoked for models that declare the extension, so uncompressed assets
// keep loading unchanged.
loader.setMeshoptDecoder(MeshoptDecoder);
const modelCache = new Map();
const modelNodes = new Map();
const helpers = new Map();
const contactShadows = new Map();
const shellOccluders = new THREE.Group();
const occluderMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  colorWrite: false,
  depthWrite: true,
  depthTest: true,
  side: THREE.DoubleSide,
});
let shellOccluderKey = '';
let glbUpdateSeq = 0;
const rendererDiagnosticsEnabled = new URLSearchParams(window.location.search).get('renderer') === 'alignment-check';
window.__glbVisibleItems = new Set();
window.__glbPhysicalBounds = new Map();
let lastGlbPixelCoverage = { width: 0, height: 0, visiblePixels: 0 };
function captureGlbPixelCoverage() {
  const gl = renderer.getContext();
  const width = gl.drawingBufferWidth;
  const height = gl.drawingBufferHeight;
  const pixels = new Uint8Array(width * height * 4);
  gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let visiblePixels = 0;
  for (let offset = 3; offset < pixels.length; offset += 4) {
    if (pixels[offset] > 0) visiblePixels += 1;
  }
  lastGlbPixelCoverage = { width, height, visiblePixels };
}
window.__readGlbPixelCoverage = () => lastGlbPixelCoverage;

const hemi = new THREE.HemisphereLight(0xffffff, 0xaeb4bc, 2.2);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(-4, 7, 5);
key.castShadow = true;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdbeafe, 1.15);
fill.position.set(4, 3, -5);
scene.add(fill);

/**
 * Applies a lighting preset to the GLB rig.
 *
 * The presets live in booth-render.js, which owns the SVG shading; this is the
 * other half. Without it, choosing "spotlight" left every model lit exactly as
 * "ambient" did, which is most of why the setting looked inert.
 */
window.__applyGlbLighting = (rig) => {
  if (!rig) return;
  hemi.intensity = Number(rig.hemi) || hemi.intensity;
  key.intensity = Number(rig.key) || key.intensity;
  fill.intensity = Number.isFinite(Number(rig.fill)) ? Number(rig.fill) : fill.intensity;
  if (Number.isFinite(Number(rig.keyColor))) key.color.setHex(Number(rig.keyColor));
  if (Number.isFinite(Number(rig.fillColor))) fill.color.setHex(Number(rig.fillColor));
  // Repaint through the same path the rest of the app uses, so the SVG and the
  // models stay in step.
  if (typeof window.renderAll === 'function') requestAnimationFrame(() => window.renderAll());
};
// The preset may have been applied before this module finished loading.
if (window.__lightingRig) window.__applyGlbLighting(window.__lightingRig);
scene.add(shellOccluders);

const shadowMaterial = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.18,
  depthWrite: false,
});

function ensureSize() {
  // Match the SVG's 1600x1000 xMidYMid slice viewport exactly. This keeps the
  // GLB layer aligned when preview mode or a browser resize changes aspect.
  const viewportW = Math.max(1, window.innerWidth || 1);
  const viewportH = Math.max(1, window.innerHeight || 1);
  const scale = Math.max(viewportW / 1600, viewportH / 1000);
  const cssWidth = 1600 * scale;
  const cssHeight = 1000 * scale;
  canvas.style.left = `${(viewportW - cssWidth) / 2}px`;
  canvas.style.top = `${(viewportH - cssHeight) / 2 + 90 * scale}px`;
  canvas.style.width = `${cssWidth}px`;
  canvas.style.height = `${cssHeight}px`;
  canvas.style.right = 'auto';
  canvas.style.bottom = 'auto';
  canvas.style.transform = 'none';
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const width = Math.max(1, Math.floor(rect.width * dpr));
  const height = Math.max(1, Math.floor(rect.height * dpr));
  if (canvas.width !== width || canvas.height !== height) {
    renderer.setPixelRatio(dpr);
    renderer.setSize(rect.width, rect.height, false);
    camera.aspect = rect.width / Math.max(1, rect.height);
    camera.updateProjectionMatrix();
  }
}

function normalizeModel(root, item) {
  const oriented = new THREE.Group();
  const wrapper = new THREE.Group();
  if (String(item.modelUrl || '').includes('/sedef_remaining_furniture_refined_v2/glb_models/')) {
    root.rotation.x = -Math.PI / 2;
  }
  oriented.add(root);
  oriented.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(oriented);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const targetW = Math.max(0.05, Number(item.w) || 0.5);
  const targetD = Math.max(0.05, Number(item.d) || 0.5);
  const targetH = Math.max(0.05, Number(item.h) || 0.5);
  const sx = size.x > 0.0001 ? targetW / size.x : 1;
  const sy = size.y > 0.0001 ? targetH / size.y : 1;
  const sz = size.z > 0.0001 ? targetD / size.z : 1;
  oriented.position.set(-center.x, -box.min.y, -center.z);
  wrapper.add(oriented);
  wrapper.scale.set(
    Number.isFinite(sx) && sx > 0 ? sx : 1,
    Number.isFinite(sy) && sy > 0 ? sy : 1,
    Number.isFinite(sz) && sz > 0 ? sz : 1
  );
  wrapper.updateMatrixWorld(true);

  wrapper.traverse(node => {
    if (!node.isMesh) return;
    // Placed instances must not share disposable resources with the cached GLB.
    // Otherwise deleting one item can make a later instance render blank.
    if (node.geometry) node.geometry = node.geometry.clone();
    node.castShadow = true;
    node.receiveShadow = true;
    if (node.material) {
      node.material = Array.isArray(node.material)
        ? node.material.map(material => material.clone())
        : node.material.clone();
      const materials = Array.isArray(node.material) ? node.material : [node.material];
      materials.forEach(material => {
        for (const [key, value] of Object.entries(material)) {
          if (!value || !value.isTexture) continue;
          material[key] = value.clone();
          material[key].needsUpdate = true;
        }
        material.side = THREE.DoubleSide;
        if (material.map) material.map.colorSpace = THREE.SRGBColorSpace;
        if ('roughness' in material) material.roughness = Math.min(0.88, Math.max(0.46, material.roughness ?? 0.62));
        if ('metalness' in material) material.metalness = Math.min(0.35, material.metalness ?? 0.04);
        material.transparent = Boolean(material.transparent && material.opacity < 1);
        material.opacity = material.opacity ?? 1;
        material.depthTest = true;
        material.depthWrite = true;
        material.needsUpdate = true;
      });
    }
  });
  return wrapper;
}

function loadModel(url) {
  if (!modelCache.has(url)) {
    modelCache.set(url, new Promise((resolve, reject) => {
      loader.load(url, gltf => resolve(gltf.scene), undefined, reject);
    }));
  }
  return modelCache.get(url);
}

function disposeMaterial(material) {
  if (!material) return;
  for (const value of Object.values(material)) {
    if (value && value.isTexture) value.dispose();
  }
  material.dispose?.();
}

function disposeObject3D(node) {
  node.traverse(child => {
    if (!child.isMesh) return;
    child.geometry?.dispose?.();
    if (Array.isArray(child.material)) child.material.forEach(disposeMaterial);
    else disposeMaterial(child.material);
  });
}

function rotationDeg(value) {
  const n = Number(value);
  return Number.isFinite(n) ? THREE.MathUtils.degToRad(n) : 0;
}

function updateShellOccluders(state) {
  const width = Math.max(1, Number(state.width) || 1);
  const depth = Math.max(1, Number(state.depth) || 1);
  const height = Math.max(0.8, Number(state.height) || 0.8);
  const fasciaHeight = Math.max(0.1, Number(state.fasciaHeight) || 0.3);
  const visible = state.wallsVisible || {};
  const nextKey = [width, depth, height, fasciaHeight, visible.front, visible.back, visible.left, visible.right].join('|');
  if (nextKey === shellOccluderKey) return;
  shellOccluderKey = nextKey;

  for (const child of [...shellOccluders.children]) {
    shellOccluders.remove(child);
    child.geometry?.dispose?.();
  }

  const addBox = (w, h, d, x, y, z) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), occluderMaterial);
    mesh.position.set(x, y, z);
    mesh.renderOrder = -100;
    mesh.frustumCulled = false;
    shellOccluders.add(mesh);
  };

  // The visible booth remains SVG. These colorless meshes only write depth so
  // GLB furniture correctly disappears behind fascia and closed wall panels.
  const fasciaY = height + fasciaHeight / 2;
  addBox(width + 0.08, fasciaHeight, 0.08, 0, fasciaY, 0.02);
  addBox(width + 0.08, fasciaHeight, 0.08, 0, fasciaY, depth - 0.02);
  addBox(0.08, fasciaHeight, depth, -width / 2 + 0.02, fasciaY, depth / 2);
  addBox(0.08, fasciaHeight, depth, width / 2 - 0.02, fasciaY, depth / 2);

  if (visible.back) addBox(width, height, 0.035, 0, height / 2, 0);
  if (visible.front) addBox(width, height, 0.035, 0, height / 2, depth);
  if (visible.left) addBox(0.035, height, depth, -width / 2, height / 2, depth / 2);
  if (visible.right) addBox(0.035, height, depth, width / 2, height / 2, depth / 2);
  window.__shellOccluderCount = shellOccluders.children.length;
}

function physicalSizeKey(item) {
  const dimension = value => Math.max(0.05, Number(value) || 0.5).toFixed(4);
  return `${String(item.modelUrl || '')}|${dimension(item.w)}|${dimension(item.d)}|${dimension(item.h)}`;
}

function groundModelNode(node, floorY = 0) {
  node.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(node);
  if (!Number.isFinite(box.min.y)) return;
  const delta = floorY - box.min.y;
  if (Math.abs(delta) < 0.0005) return;
  node.position.y += delta;
  node.updateMatrixWorld(true);
}

async function ensureModel(item, state) {
  const keyId = String(item.id || item.sku || item.modelUrl);
  const expectedSizeKey = physicalSizeKey(item);
  const existing = modelNodes.get(keyId);
  if (existing?.userData.physicalSizeKey === expectedSizeKey) return existing;
  if (existing) {
    scene.remove(existing);
    disposeObject3D(existing);
    modelNodes.delete(keyId);
    window.__glbVisibleItems.delete(keyId);
    window.__glbPhysicalBounds.delete(keyId);
    const helper = helpers.get(keyId);
    if (helper) {
      scene.remove(helper);
      helper.geometry?.dispose?.();
      helper.material?.dispose?.();
      helpers.delete(keyId);
    }
  }
  const source = await loadModel(item.modelUrl);
  const holder = new THREE.Group();
  holder.name = keyId;
  holder.userData.physicalSizeKey = expectedSizeKey;
  const root = source.clone(true);
  holder.add(normalizeModel(root, item));
  scene.add(holder);
  modelNodes.set(keyId, holder);
  return holder;
}

function removeMissingModels(activeIds) {
  for (const [id, node] of modelNodes.entries()) {
    if (activeIds.has(id)) continue;
    scene.remove(node);
    disposeObject3D(node);
    modelNodes.delete(id);
    window.__glbVisibleItems.delete(id);
    window.__glbPhysicalBounds.delete(id);
  }
  for (const [id, helper] of helpers.entries()) {
    if (activeIds.has(id)) continue;
    scene.remove(helper);
    helper.geometry?.dispose?.();
    helper.material?.dispose?.();
    helpers.delete(id);
  }
  for (const [id, shadow] of contactShadows.entries()) {
    if (activeIds.has(id)) continue;
    scene.remove(shadow);
    shadow.geometry.dispose();
    shadow.material?.dispose?.();
    contactShadows.delete(id);
  }
}

function renderScene(state) {
  ensureSize();

  if (Array.isArray(state.cam)) camera.position.set(state.cam[0], state.cam[1], state.cam[2]);
  const target = Array.isArray(state.target) ? state.target : [0, 1.5, 1.5];
  camera.fov = Number(state.fov) || 30;
  camera.lookAt(target[0], target[1], target[2]);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  if (rendererDiagnosticsEnabled) captureGlbPixelCoverage();
}

window.__updateGlbLayer = async function updateGlbLayer(state) {
  const updateSeq = ++glbUpdateSeq;
  window.__lastGlbState = state;
  const items = Array.isArray(state.placedItems) ? state.placedItems.filter(item => item && item.modelUrl) : [];
  const activeIds = new Set(items.map(item => String(item.id || item.sku || item.modelUrl)));
  removeMissingModels(activeIds);
  updateShellOccluders(state);

  for (const item of items) {
    const id = String(item.id || item.sku || item.modelUrl);
    try {
      const node = await ensureModel(item, state);
      if (updateSeq !== glbUpdateSeq || !activeIds.has(id)) {
        scene.remove(node);
        disposeObject3D(node);
        // A newer async update may already own this ID. Never detach its cache
        // entry while cleaning up an older model instance.
        if (modelNodes.get(id) === node) {
          modelNodes.delete(id);
          window.__glbVisibleItems.delete(id);
          window.__glbPhysicalBounds.delete(id);
        }
        continue;
      }
      const x = -Number(state.width || 0) / 2 + (Number(item.x) || 0);
      const z = Number(item.z) || 0;
      // Drawing must not move what it draws - see placedItemRenderXZ.
      const clamped = placedItemRenderXZ(item, x, z);
      if (typeof syncCorrectedItemPosition === 'function') {
        syncCorrectedItemPosition(item, clamped.x, clamped.z);
      }
      // Sit the model at its own mount height, not on the floor. This was
      // hardcoded to 0 and then grounded to 0 below, so a light pinned to the
      // top beam and a shelf mounted at chest height both rendered on the
      // carpet - the constraint had put them in the right place and the model
      // layer dropped them straight back down.
      const baseY = typeof mountedBaseY === 'function' ? mountedBaseY(item) : 0;
      node.position.set(clamped.x, baseY, clamped.z);
      node.rotation.order = 'XYZ';
      node.rotation.x = rotationDeg(item.rotationX);
      node.rotation.y = rotationDeg(item.rotationY ?? item.rotation);
      node.rotation.z = rotationDeg(item.rotationZ);
      node.visible = true;
      groundModelNode(node, baseY);

      let contact = contactShadows.get(id);
      if (!contact) {
        contact = new THREE.Mesh(new THREE.CircleGeometry(0.5, 48), shadowMaterial.clone());
        contact.rotation.x = -Math.PI / 2;
        contact.renderOrder = -2;
        contactShadows.set(id, contact);
        scene.add(contact);
      }
      contact.position.set(clamped.x, 0.012, clamped.z);
      contact.scale.set(Math.max(0.34, Number(item.w) || 0.5), Math.max(0.24, Number(item.d) || 0.5), 1);
      contact.visible = true;

      const visibleBox = new THREE.Box3().setFromObject(node);
      const visibleSize = visibleBox.getSize(new THREE.Vector3());
      const hasVisibleBounds = visibleSize.x > 0.01 && visibleSize.y > 0.01 && visibleSize.z > 0.01;
      if (hasVisibleBounds) {
        window.__glbPhysicalBounds.set(id, {
          width: visibleSize.x,
          depth: visibleSize.z,
          height: visibleSize.y,
          targetWidth: Math.max(0.05, Number(item.w) || 0.5),
          targetDepth: Math.max(0.05, Number(item.d) || 0.5),
          targetHeight: Math.max(0.05, Number(item.h) || 0.5),
          sizeKey: node.userData.physicalSizeKey,
        });
      }
      if (hasVisibleBounds && !window.__glbVisibleItems.has(id)) {
        window.__glbVisibleItems.add(id);
        if (typeof window.renderAll === 'function') requestAnimationFrame(() => window.renderAll());
      }

      let helper = helpers.get(id);
      if (String(state.selectedItemId || '') === id) {
        if (!helper) {
          helper = new THREE.BoxHelper(node, 0x2563eb);
          helpers.set(id, helper);
          scene.add(helper);
        }
        helper.visible = true;
        helper.update();
      } else if (helper) {
        helper.visible = false;
      }
    } catch (error) {
      window.__glbVisibleItems.delete(id);
      console.error('GLB load failed', item.modelUrl, error);
    }
  }
  renderScene(state);
};

window.addEventListener('resize', () => {
  if (window.__lastGlbState) window.__updateGlbLayer(window.__lastGlbState);
});

function disposeRenderer() {
  removeMissingModels(new Set());
  for (const child of [...shellOccluders.children]) child.geometry?.dispose?.();
  occluderMaterial.dispose();
  renderer.dispose();
}
window.addEventListener('beforeunload', disposeRenderer);
// pagehide fires in bfcache scenarios and iOS Safari where beforeunload is unreliable.
window.addEventListener('pagehide', disposeRenderer);

window.addEventListener('keydown', (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  // Delete / Backspace — request parent to remove selected furniture item
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedItemId != null) {
    e.preventDefault();
    window.parent.postMessage({ type: 'workspaceItemDeleteRequested', id: selectedItemId }, '*');
    return;
  }

  // [ / ] — rotate selected item by ±15° increments
  if ((e.key === '[' || e.key === ']') && selectedItemId != null) {
    e.preventDefault();
    const item = placedItems.find(entry => String(entry.id) === String(selectedItemId));
    if (!item || item.locked) return;
    const delta = e.key === '[' ? -15 : 15;
    const currentY = Number.isFinite(Number(item.rotationY)) ? Number(item.rotationY) : 0;
    const newRotationY = ((currentY + delta) % 360 + 360) % 360;
    window.parent.postMessage({ type: 'workspaceItemRotated', id: selectedItemId, rotationY: newRotationY }, '*');
    return;
  }
});

if (window.__pendingGlbState) {
  window.__updateGlbLayer(window.__pendingGlbState);
}
</script>
</body>
</html>
