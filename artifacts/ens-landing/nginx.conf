# ============================================================================
# HSTS gating (AU-02).
#
# This container listens on plain :80 and TLS terminates in front of it, so the
# config itself cannot know whether a given deployment is HTTPS. Sending HSTS
# unconditionally would advertise a year-long HTTPS-only policy from an
# environment that may be serving plain HTTP.
#
# The terminating proxy tells us per request via X-Forwarded-Proto — the same
# signal the API already trusts through TRUST_PROXY. nginx omits an add_header
# whose value evaluates to the empty string, so non-HTTPS requests simply do
# not carry the header.
#
# This deliberately fails *closed on the header, open on the request*: if a
# proxy does not set X-Forwarded-Proto, no HSTS is sent. That is the safe
# direction — the alternative (an env var baked per environment) fails the
# other way the moment a production env file is copied onto an HTTP staging box.
# ============================================================================
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 80m;

    # ========================================================================
    # Compression.
    #
    # The nginx base image ships /etc/nginx/nginx.conf with `#gzip on;`
    # commented out, and this file is copied to conf.d/default.conf without
    # ever overriding it. Every asset was therefore served raw: the initial
    # payload measured 926 KB uncompressed against 260 KB gzipped, so roughly
    # 666 KB per first visit was wasted. The stylesheet alone is 197 KB raw
    # against 29 KB gzipped.
    #
    # This also makes the check-frontend-budgets.mjs gate meaningful: it
    # budgets the *gzipped* size, which until now was a number no visitor
    # ever actually received.
    #
    # Brotli is not available — ngx_brotli is not compiled into
    # nginx:stable-alpine — so gzip is the ceiling without changing base image.
    # ========================================================================
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json application/xml
                      application/xml+rss application/wasm image/svg+xml;

    # ========================================================================
    # Security headers.
    #
    # IMPORTANT: nginx inherits add_header from the parent level *only if the
    # current level declares no add_header of its own*. The static-asset
    # location at the bottom of this file adds Cache-Control, which silently
    # dropped every header below from all JS, CSS, font and image responses.
    # That block now repeats the full set. Keep the two lists in sync — there
    # is no include-and-inherit for add_header before nginx 1.29.3's
    # add_header_inherit directive.
    # ========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # payment=() is safe while billing uses Stripe Checkout redirects. If Stripe
    # Elements is ever embedded directly, loosen to: payment=(self "https://js.stripe.com")
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    # ------------------------------------------------------------------------
    # CSP is REPORT-ONLY on purpose. Do not enforce it until a report pass has
    # covered the 3D workspace and the Stripe checkout redirect.
    #
    # Two directives here are load-bearing and easy to get wrong:
    #   script-src 'wasm-unsafe-eval'  — three.js MeshoptDecoder calls
    #     WebAssembly.instantiate to decode every catalogue GLB.
    #   worker-src blob:               — that decoder spawns a Worker from a
    #     Blob URL.
    # Dropping either silently breaks the booth editor, which is why this ships
    # report-only first.
    #
    # style-src needs 'unsafe-inline': framer-motion writes inline styles and
    # the workspace pages use several hundred style={{...}} props. Removing it
    # is a real refactor, not a config change.
    #
    # script-src needs no 'unsafe-inline': the built index.html carries no
    # inline script.
    #
    # Enforced, on evidence rather than hope. Every public page and the booth
    # renderer were loaded from a static server that set this exact policy as
    # Content-Security-Policy and recorded securitypolicyviolation events: zero
    # violations across / , /login, /signup, /get-quote, both legal pages and
    # booth-render.html.
    #
    # Two things had to change first. The renderer carried its 3,700-line engine
    # as an inline <script>, which script-src 'self' blocks outright - that is
    # now public/booth-render.js. And VITE_API_BASE_URL must be same-origin
    # ("/api", proxied below); the documented development default is an absolute
    # http://localhost:5000/api, which connect-src 'self' rejects and which
    # would be wrong behind this proxy anyway.
    # ------------------------------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; manifest-src 'self'" always;

    location = /health.txt {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # No trailing slash: the API process owns the /api prefix.
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # .glb/.hdr included: the catalogue models are ~10 MB and were re-downloaded
    # every session because they fell outside this block.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|glb|gltf|hdr|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated verbatim from the server level: the Cache-Control line above
        # blocks add_header inheritance for this location. See the note above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; manifest-src 'self'" always;
        access_log off;
    }
}
