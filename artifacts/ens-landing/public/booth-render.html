<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Booth Render</title>
<style>
  :root {
    --bg-top:    #eef0f2;
    --bg-bot:    #c9ccd0;
    --ink:       #1a1d22;
    --ink-dim:   #6b7079;
    --line:      rgba(20,22,26,0.10);
    --card-bg:   rgba(255,255,255,0.78);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    font: 12px/1.4 "Inter", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: fixed; inset: 0; }
  svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
  svg.scene { animation: sceneIn .9s ease-out; }
  @keyframes hudIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .hud > * { animation: hudIn .5s ease-out backwards; }
  .hud.bl > *:nth-child(1) { animation-delay: 0.4s; }
  .hud.bl > *:nth-child(2) { animation-delay: 0.45s; }
  .hud.br > * { animation-delay: 0.5s; }
  .hud.tr > * { animation-delay: 0.55s; }

  .hud { position: absolute; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud.tr { top: 18px; right: 18px; display: flex; gap: 8px; }
  .hud.bl { left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; }
  .hud.br { right: 18px; bottom: 18px; display: flex; gap: 8px; align-items: flex-end; }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(20,22,26,0.04), 0 12px 32px rgba(20,22,26,0.08);
    padding: 9px 12px;
    color: var(--ink);
  }
  .card .k { color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 9.5px; font-weight: 500; }
  .card .v { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 500; }
  .card .row { display: flex; align-items: center; gap: 8px; }
  .card .sep { width: 1px; height: 11px; background: var(--line); }

  .toolbar { padding: 4px; display: flex; gap: 2px; }
  .toolbar button {
    width: 28px; height: 28px; border: 0; background: transparent;
    color: var(--ink-dim); border-radius: 5px; cursor: pointer;
    display: grid; place-items: center;
    transition: background .12s, color .12s;
  }
  .toolbar button:hover { background: rgba(20,22,26,0.05); color: var(--ink); }
  .toolbar button.active { background: rgba(20,22,26,0.08); color: var(--ink); }
  .toolbar button svg { width: 14px; height: 14px; stroke-width: 1.6; }
  .toolbar .div { width: 1px; height: 18px; background: var(--line); margin: 0 2px; align-self: center; }

  .meta-title {
    font-size: 12px; font-weight: 600; letter-spacing: -0.005em;
    display: flex; align-items: center; gap: 8px;
  }
  .meta-title .pill {
    font-size: 9.5px; padding: 2px 6px; border-radius: 4px;
    background: rgba(20,22,26,0.06); color: var(--ink-dim); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  .ruler {
    position: absolute; bottom: 96px; right: 24px;
    display: flex; align-items: center; gap: 6px;
    color: var(--ink-dim); font-size: 10px;
    animation: hudIn .5s ease-out 0.6s backwards;
  }
  .ruler .bar { width: 88px; height: 1.5px; background: var(--ink); position: relative; opacity: 0.6; }
  .ruler .bar::before, .ruler .bar::after {
    content: ''; position: absolute; top: -3px; width: 1px; height: 7px; background: var(--ink); opacity: 0.7;
  }
  .ruler .bar::before { left: 0; } .ruler .bar::after { right: 0; }

  .ann { position: absolute; pointer-events: none; font-size: 10px;
    color: var(--ink-dim); letter-spacing: 0.04em;
    animation: hudIn .5s ease-out 0.7s backwards;
  }
  .ann .lbl {
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 4px;
    font-variant-numeric: tabular-nums; font-weight: 500;
    color: var(--ink);
  }

  svg.scene polygon[data-pid] { cursor: pointer; }
  svg.scene polygon[data-pid]:hover { filter: brightness(1.05); }

  .crumb {
    font-size: 11px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .crumb b { color: var(--ink); font-weight: 600; }
  .crumb .sep { opacity: 0.4; }

  .info-line { display: flex; gap: 14px; align-items: center; }
</style>
</head>
<body>
<div class="stage">

  <svg class="scene" id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#f3f4f6"/>
        <stop offset="60%" stop-color="#dadde1"/>
        <stop offset="100%" stop-color="#b8bcc1"/>
      </linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bcbfc4"/>
        <stop offset="50%" stop-color="#ced1d5"/>
        <stop offset="100%" stop-color="#dfe1e4"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#eef0f2"/>
      </linearGradient>
      <linearGradient id="panel-side" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f6f7f9"/>
        <stop offset="100%" stop-color="#dadde1"/>
      </linearGradient>
      <linearGradient id="panel-shade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#dee0e3"/>
        <stop offset="100%" stop-color="#b5b8bd"/>
      </linearGradient>
      <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"  stop-color="#8e9298"/>
        <stop offset="30%" stop-color="#c8ccd0"/>
        <stop offset="55%" stop-color="#dfe2e6"/>
        <stop offset="80%" stop-color="#a4a8ae"/>
        <stop offset="100%" stop-color="#7a7e84"/>
      </linearGradient>
      <linearGradient id="alu-h" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d8dbdf"/>
        <stop offset="45%" stop-color="#bfc3c8"/>
        <stop offset="100%" stop-color="#8c9097"/>
      </linearGradient>
      <linearGradient id="alu-cap" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e2e5e8"/>
        <stop offset="100%" stop-color="#a8acb1"/>
      </linearGradient>
      <linearGradient id="fascia" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fbfcfd"/>
        <stop offset="100%" stop-color="#e6e8eb"/>
      </linearGradient>
      <pattern id="tile" x="0" y="0" width="180" height="180" patternUnits="userSpaceOnUse">
        <rect width="180" height="180" fill="none"/>
        <line x1="0" y1="0" x2="180" y2="0" stroke="rgba(20,22,26,0.07)" stroke-width="0.7"/>
        <line x1="0" y1="0" x2="0" y2="180" stroke="rgba(20,22,26,0.07)" stroke-width="0.7"/>
      </pattern>
      <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="rgba(20,22,26,0.35)"/>
        <stop offset="65%" stop-color="rgba(20,22,26,0.08)"/>
        <stop offset="100%" stop-color="rgba(20,22,26,0)"/>
      </radialGradient>
      <linearGradient id="reflect-fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(0,0,0,0.20)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </linearGradient>
      <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
        <stop offset="65%" stop-color="rgba(0,0,0,0)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
      </radialGradient>
      <filter id="blur-soft" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur stdDeviation="2.2"/>
      </filter>
    </defs>

    <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>
    <g id="floorGroup"></g>
    <g id="boothGroup"></g>
    <rect x="0" y="0" width="1600" height="1000" fill="url(#vignette)" pointer-events="none"/>
  </svg>

  <div class="hud tr">
    <div class="card toolbar" id="view-toolbar">
      <button data-view="front" title="Front">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21l9-5 9 5M3 21V9l9-5 9 5v12"/></svg>
      </button>
      <button class="active" data-view="3q" title="3/4 view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
      </button>
      <button data-view="side" title="Side">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="5" width="16" height="14"/><path d="M4 9h16"/></svg>
      </button>
      <button data-view="top" title="Top plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="4" width="16" height="16"/><path d="M4 9h16M9 4v16"/></svg>
      </button>
      <span class="div"></span>
      <button id="btn-reset" title="Reset view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
    <div class="card toolbar" id="profile-toolbar" title="Column profile">
      <button data-prof="maxima" title="Maxima · square 40×40">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="6" width="12" height="12" rx="0.5"/><path d="M12 6v12M6 12h12" opacity="0.45"/></svg>
      </button>
      <button data-prof="octa" title="Octanorm · Ø40 / 8 grooves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="6"/><path d="M12 6v12M6 12h12M7.76 7.76l8.48 8.48M16.24 7.76l-8.48 8.48" opacity="0.45"/></svg>
      </button>
    </div>
  </div>

  <div class="hud bl">
    <div class="card">
      <div class="meta-title">
        <span id="hud-system">Octanorm</span>
        <span class="pill" id="hud-type">Stand</span>
      </div>
      <div class="crumb" style="margin-top:6px;">
        <span id="hud-dims">6.0 × 3.0 m</span>
        <span class="sep">·</span>
        <span id="hud-height">2.50 m total</span>
        <span class="sep">·</span>
        <span>40 mm profile</span>
      </div>
    </div>
    <div class="card">
      <div class="info-line">
        <div class="row"><span class="k">drag</span><span class="v">orbit</span></div>
        <div class="sep"></div>
        <div class="row"><span class="k">scroll</span><span class="v">zoom</span></div>
        <div class="sep"></div>
        <div class="row"><span class="k">click</span><span class="v">inspect part</span></div>
      </div>
    </div>
  </div>

  <div class="hud br">
    <div class="card" id="sel-card" style="display:none; min-width:200px;">
      <div class="k">selected component</div>
      <div id="sel-label" style="font-size:12px; font-weight:600; margin-top:4px;">—</div>
      <div id="sel-meta" style="font-size:10px; color:var(--ink-dim); margin-top:2px;">—</div>
    </div>
    <div class="card">
      <div class="info-line" style="font-size:10px;">
        <div class="row"><span class="k">cam</span><span class="v" id="cam-az">32°</span></div>
        <div class="sep"></div>
        <div class="row"><span class="k">fov</span><span class="v">32mm</span></div>
        <div class="sep"></div>
        <div class="row"><span class="k">light</span><span class="v">studio</span></div>
      </div>
    </div>
  </div>

  <div class="ruler">
    <span>scale</span>
    <div class="bar"></div>
    <span>1.0 m</span>
  </div>

  <div class="ann" id="dim-w"><div class="lbl">6.0 m</div></div>
  <div class="ann" id="dim-d"><div class="lbl">3.0 m</div></div>
  <div class="ann" id="dim-h"><div class="lbl">2.5 m</div></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Booth renderer — perspective-projected SVG.
// Config via URL params: w, d, h, name, style (octa|maxima), open (front,back,left,right)
// Live updates via postMessage: { type:'boothUpdate', w, d, h, name, style, open }
// ─────────────────────────────────────────────────────────────────────────────

const SVG_NS = 'http://www.w3.org/2000/svg';
const VW = 1600, VH = 1000;

// ── Read URL params ──────────────────────────────────────────────────────────
const _P = new URLSearchParams(location.search);
let BW = Math.max(1, parseFloat(_P.get('w')  || '6'));    // booth width (X)
let BD = Math.max(1, parseFloat(_P.get('d')  || '3'));    // booth depth (Z)
let BH = Math.max(0.8, parseFloat(_P.get('h') || '2.20')); // wall panel height
const FH = 0.30;                                           // fascia height (fixed)
const EX = 0.04;                                           // profile thickness 40mm
let COMPANY_NAME = decodeURIComponent(_P.get('name') || 'Company Name');
let PANELS_BACK = Math.max(1, Math.round(BW));
let PANELS_SIDE = Math.max(1, Math.round(BD));
let CARPET_COLOR = _P.get('carpet') || '#3b3e44';

const _openInit = new Set((_P.get('open') || 'front').split(',').map(s=>s.trim()).filter(Boolean));
let wallsVisible = {
  back:  !_openInit.has('back'),
  left:  !_openInit.has('left'),
  right: !_openInit.has('right'),
  front: !_openInit.has('front'),
};

// ── Camera ───────────────────────────────────────────────────────────────────
const VIEWS = {
  '3q':    { azimuth: Math.PI * 0.22,  elevation: Math.PI * 0.13, distance: 13.5 },
  'front': { azimuth: 0,               elevation: Math.PI * 0.06, distance: 14.5 },
  'side':  { azimuth: Math.PI * 0.5,   elevation: Math.PI * 0.06, distance: 13.0 },
  'top':   { azimuth: 0.0001,          elevation: Math.PI * 0.49, distance: 12.0 },
};

function defaultTarget() { return [0, (BH + FH) * 0.5, BD * 0.35]; }
const camState = { ...VIEWS['3q'], target: defaultTarget() };
let cam, fwd, right, up;
const upVec = [0, 1, 0];
const fov   = 30;

function updateCamera() {
  const { azimuth, elevation, distance, target } = camState;
  cam = [
    target[0] + distance * Math.cos(elevation) * Math.sin(azimuth),
    target[1] + distance * Math.sin(elevation),
    target[2] + distance * Math.cos(elevation) * Math.cos(azimuth),
  ];
  fwd   = norm(sub(target, cam));
  right = norm(cross(fwd, upVec));
  up    = cross(right, fwd);
}

// ── Studio lighting ──────────────────────────────────────────────────────────
const lightDir = norm([-0.45, 1.0, 0.55]);
const fillDir  = norm([ 0.7,  0.4, 0.2]);

// ── Math helpers ─────────────────────────────────────────────────────────────
function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function add(a,b){ return [a[0]+b[0], a[1]+b[1], a[2]+b[2]]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function len(a){ return Math.hypot(a[0],a[1],a[2]); }
function norm(a){ const l=len(a); return l<1e-9?[0,1,0]:[a[0]/l,a[1]/l,a[2]/l]; }

const fScale = 1 / Math.tan((fov * Math.PI / 180) / 2);
const aspect = VW / VH;
updateCamera();

function project(p) {
  const v = sub(p, cam);
  const x = dot(v, right);
  const y = dot(v, up);
  const z = dot(v, fwd);
  if (z <= 0.05) return null;
  const sx = (x * fScale / aspect / z) * (VW/2) + VW/2;
  const sy = -(y * fScale / z) * (VH/2) + VH/2 + 90;
  return { x: sx, y: sy, depth: z };
}

// ── Geometry builder ─────────────────────────────────────────────────────────
let faces = [];
let _gid = 0;
let columnStyle = (_P.get('style') === 'maxima') ? 'maxima' : 'octa';

function pushBox(min, max, props) {
  const gid = ++_gid;
  const [x0,y0,z0] = min, [x1,y1,z1] = max;
  const f = (pts, normal, suffix) => faces.push({
    pts, normal, gid,
    partId: (props.partId || 'part') + '-' + gid + suffix,
    ...props,
  });
  f([[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]], [1,0,0], ':+x');
  f([[x0,y0,z1],[x0,y0,z0],[x0,y1,z0],[x0,y1,z1]], [-1,0,0], ':-x');
  f([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], [0,0,1], ':+z');
  f([[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]], [0,0,-1], ':-z');
  f([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], [0,1,0], ':+y');
  f([[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]], [0,-1,0], ':-y');
  return gid;
}

function pushPrism(cx, cz, y0, y1, radius, segments, props) {
  const gid = ++_gid;
  const verts = [];
  const offset = Math.PI / segments;
  for (let i = 0; i < segments; i++) {
    const a = (i / segments) * Math.PI * 2 + offset;
    verts.push([cx + Math.cos(a) * radius, cz + Math.sin(a) * radius, a]);
  }
  for (let i = 0; i < segments; i++) {
    const j = (i + 1) % segments;
    const zi = verts[i][1], zj = verts[j][1];
    const xi = verts[i][0], xj = verts[j][0];
    const ma = ((i + 0.5) / segments) * Math.PI * 2 + offset;
    faces.push({
      pts: [[xi, y0, zi], [xj, y0, zj], [xj, y1, zj], [xi, y1, zi]],
      normal: [Math.cos(ma), 0, Math.sin(ma)],
      gid,
      partId: (props.partId || 'part') + '-' + gid + ':side' + i,
      hasFacetEdge: true,
      ...props,
    });
  }
  faces.push({ pts: verts.map(([x, z]) => [x, y1, z]), normal: [0,1,0], gid,
    partId: (props.partId||'part')+'-'+gid+':+y', ...props });
  faces.push({ pts: verts.slice().reverse().map(([x, z]) => [x, y0, z]), normal: [0,-1,0], gid,
    partId: (props.partId||'part')+'-'+gid+':-y', ...props });
  return gid;
}

function pushPost(cx, cz, y0, y1, props) {
  const T = EX;
  pushBox(
    [cx - T*0.55, y0 - 0.005, cz - T*0.55],
    [cx + T*0.55, y0 + 0.018, cz + T*0.55],
    { fill: '#2a2d33', isAlu: true, partId: (props.partId||'post')+'-foot',
      partLabel: 'Foot cap', partMeta: 'Adjustable base · nylon' }
  );
  pushBox(
    [cx - T*0.58, y1 - T*0.55, cz - T*0.58],
    [cx + T*0.58, y1 + T*0.05, cz + T*0.58],
    { fill: 'url(#alu-cap)', isAlu: true, partId: (props.partId||'post')+'-cube',
      partLabel: 'Connector cube', partMeta: 'K-block joint · die-cast aluminum' }
  );
  if (columnStyle === 'octa') {
    return pushPrism(cx, cz, y0 + 0.018, y1 - T*0.55, T * 0.5, 8,
      { fill: 'url(#alu)', isAlu: true, isOctaPost: true, ...props });
  }
  return pushBox(
    [cx - T/2, y0 + 0.018, cz - T/2],
    [cx + T/2, y1 - T*0.55, cz + T/2],
    { fill: 'url(#alu)', isAlu: true, isMaximaPost: true, ...props }
  );
}

function cz_clamp(v, off) { return v + off; }

function buildWall(name, p1, p2, numPanels, normal) {
  const wallLen = Math.hypot(p2[0]-p1[0], p2[2]-p1[2]);
  const dir = [(p2[0]-p1[0])/wallLen, 0, (p2[2]-p1[2])/wallLen];
  const perp = [-dir[2], 0, dir[0]];
  const T = EX;
  const bayLen = wallLen / numPanels;

  for (let i = 0; i < numPanels; i++) {
    const s0 = i * bayLen + EX * 0.6;
    const s1 = (i + 1) * bayLen - EX * 0.6;
    const x1p = p1[0] + dir[0] * s0, z1p = p1[2] + dir[2] * s0;
    const x2p = p1[0] + dir[0] * s1, z2p = p1[2] + dir[2] * s1;
    const off = EX * 0.15;
    faces.push({
      pts: [
        [x1p - perp[0]*off, EX*0.5, z1p - perp[2]*off],
        [x2p - perp[0]*off, EX*0.5, z2p - perp[2]*off],
        [x2p - perp[0]*off, BH - EX*0.5, z2p - perp[2]*off],
        [x1p - perp[0]*off, BH - EX*0.5, z1p - perp[2]*off],
      ],
      fill: 'url(#panel)', normal,
      partId: 'panel-' + name + '-' + i,
      partLabel: 'Infill panel · ' + name + ' bay ' + (i+1),
      partMeta: Math.round(bayLen*1000-40) + ' × ' + Math.round((BH-EX)*1000) + ' mm · white laminate',
    });
    faces.push({
      pts: [
        [x2p + perp[0]*off, EX*0.5, z2p + perp[2]*off],
        [x1p + perp[0]*off, EX*0.5, z1p + perp[2]*off],
        [x1p + perp[0]*off, BH - EX*0.5, z1p + perp[2]*off],
        [x2p + perp[0]*off, BH - EX*0.5, z2p + perp[2]*off],
      ],
      fill: 'url(#panel-side)',
      normal: [-normal[0], -normal[1], -normal[2]],
    });
  }

  for (let i = 0; i <= numPanels; i++) {
    const s = i * bayLen;
    const cx = p1[0] + dir[0] * s;
    const cz = p1[2] + dir[2] * s;
    pushPost(cx, cz, 0, BH + FH, {
      partId: 'post-' + name + '-' + i,
      partLabel: 'Vertical post · ' + name + ' #' + (i+1),
      partMeta: columnStyle === 'octa'
        ? 'Ø 40 mm Octanorm profile · 8 grooves · anodized'
        : '40 × 40 mm Maxima profile · anodized',
    });
  }

  const isAlongX = Math.abs(dir[0]) > Math.abs(dir[2]);
  if (isAlongX) {
    const xMin = Math.min(p1[0], p2[0]) - T/2;
    const xMax = Math.max(p1[0], p2[0]) + T/2;
    pushBox([xMin, BH - T*0.4, cz_clamp(p1[2], -T/2)],
            [xMax, BH + T*0.4, cz_clamp(p1[2], +T/2)],
            { fill: 'url(#alu-h)', isAlu: true, partId: 'rail-top-' + name,
              partLabel: 'Top rail · ' + name, partMeta: 'Header beam · brushed aluminum' });
    pushBox([xMin, 0, cz_clamp(p1[2], -T/2)],
            [xMax, T*0.5, cz_clamp(p1[2], +T/2)],
            { fill: 'url(#alu-h)', isAlu: true, partId: 'rail-bot-' + name,
              partLabel: 'Bottom rail · ' + name, partMeta: 'Floor profile · brushed aluminum' });
  } else {
    const zMin = Math.min(p1[2], p2[2]) - T/2;
    const zMax = Math.max(p1[2], p2[2]) + T/2;
    pushBox([cz_clamp(p1[0], -T/2), BH - T*0.4, zMin],
            [cz_clamp(p1[0], +T/2), BH + T*0.4, zMax],
            { fill: 'url(#alu-h)', isAlu: true, partId: 'rail-top-' + name,
              partLabel: 'Top rail · ' + name, partMeta: 'Header beam · brushed aluminum' });
    pushBox([cz_clamp(p1[0], -T/2), 0, zMin],
            [cz_clamp(p1[0], +T/2), T*0.5, zMax],
            { fill: 'url(#alu-h)', isAlu: true, partId: 'rail-bot-' + name,
              partLabel: 'Bottom rail · ' + name, partMeta: 'Floor profile · brushed aluminum' });
  }
  return { dir, perp, wallLen, numPanels, bayLen };
}

function buildBoothGeometry() {
  faces = [];
  _gid = 0;

  if (wallsVisible.back)  buildWall('back',  [-BW/2, 0,  0],  [ BW/2, 0,  0],  PANELS_BACK, [0, 0,  1]);
  if (wallsVisible.right) buildWall('right', [ BW/2, 0,  0],  [ BW/2, 0, BD],  PANELS_SIDE, [-1,0,  0]);
  if (wallsVisible.left)  buildWall('left',  [-BW/2, 0,  0],  [-BW/2, 0, BD],  PANELS_SIDE, [1, 0,  0]);
  if (wallsVisible.front) buildWall('front', [-BW/2, 0, BD],  [ BW/2, 0, BD],  PANELS_BACK, [0, 0,  1]);

  buildFascia();

}

// ── Floor ────────────────────────────────────────────────────────────────────
function buildFloor() {
  const g = document.getElementById('floorGroup');
  const floorVerts = [[-22,0,-10],[22,0,-10],[22,0,22],[-22,0,22]].map(project);
  if (floorVerts.every(Boolean)) {
    const path = floorVerts.map(p=>`${p.x},${p.y}`).join(' ');
    const fp = document.createElementNS(SVG_NS, 'polygon');
    fp.setAttribute('points', path); fp.setAttribute('fill', 'url(#floor)');
    g.appendChild(fp);
    const tilePoly = document.createElementNS(SVG_NS, 'polygon');
    tilePoly.setAttribute('points', path); tilePoly.setAttribute('fill', 'url(#tile)');
    tilePoly.setAttribute('opacity', '0.5'); g.appendChild(tilePoly);
  }
  for (let i = -20; i <= 22; i += 2) {
    const a=project([i,0,-10]), b=project([i,0,22]);
    if (a&&b) { const ln=document.createElementNS(SVG_NS,'line');
      ln.setAttribute('x1',a.x); ln.setAttribute('y1',a.y);
      ln.setAttribute('x2',b.x); ln.setAttribute('y2',b.y);
      ln.setAttribute('stroke','rgba(20,22,26,0.06)'); ln.setAttribute('stroke-width','0.7');
      g.appendChild(ln); }
    const c=project([-22,0,i]), d=project([22,0,i]);
    if (c&&d) { const ln=document.createElementNS(SVG_NS,'line');
      ln.setAttribute('x1',c.x); ln.setAttribute('y1',c.y);
      ln.setAttribute('x2',d.x); ln.setAttribute('y2',d.y);
      ln.setAttribute('stroke','rgba(20,22,26,0.06)'); ln.setAttribute('stroke-width','0.7');
      g.appendChild(ln); }
  }
  const shCenter = project([0, 0, BD * 0.35]);
  if (shCenter) {
    const sh = document.createElementNS(SVG_NS, 'ellipse');
    sh.setAttribute('cx', shCenter.x); sh.setAttribute('cy', shCenter.y + 14);
    sh.setAttribute('rx', Math.max(300, BW*90)); sh.setAttribute('ry', Math.max(60, BD*30));
    sh.setAttribute('fill', 'url(#shadow)'); sh.setAttribute('opacity', '0.7');
    g.appendChild(sh);
  }
}

// ── Shading ───────────────────────────────────────────────────────────────────
function faceIntensity(face) {
  let n = face.normal;
  if (!n) {
    const v1 = sub(face.pts[1], face.pts[0]);
    const v2 = sub(face.pts[2], face.pts[0]);
    n = norm(cross(v1, v2));
  }
  const key  = Math.max(0, dot(n, lightDir));
  const fill = Math.max(0, dot(n, fillDir)) * 0.35;
  const amb  = 0.55;
  return Math.min(1, amb + key * 0.45 + fill);
}

function avgDepth(face) {
  let sum = 0;
  for (const p of face.pts) sum += dot(sub(p, cam), fwd);
  return sum / face.pts.length;
}

// ── Render ────────────────────────────────────────────────────────────────────
let selectedKey = null;

function renderBooth() {
  const g = document.getElementById('boothGroup');
  const sorted = [...faces].map((f,i)=>({...f, idx:i, depth:avgDepth(f)}))
    .sort((a,b) => b.depth - a.depth);

  const container = document.createElementNS(SVG_NS, 'g');
  g.appendChild(container);

  for (const face of sorted) {
    const proj = face.pts.map(project);
    if (proj.some(p => !p)) continue;

    if (face.normal) {
      const camDir = norm(sub(face.pts[0], cam));
      if (dot(face.normal, camDir) > 0.08) continue;
    }

    const intensity = faceIntensity(face);
    const points = proj.map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');

    const poly = document.createElementNS(SVG_NS, 'polygon');
    poly.setAttribute('points', points);
    poly.setAttribute('fill', face.fill);
    if (face.partId) {
      poly.setAttribute('data-pid', face.partId);
      poly.setAttribute('data-label', face.partLabel || face.partId);
      poly.setAttribute('data-meta', face.partMeta || '');
    }
    container.appendChild(poly);

    if (intensity < 0.98) {
      const sh = document.createElementNS(SVG_NS, 'polygon');
      sh.setAttribute('points', points);
      const alpha = Math.max(0, (1 - intensity)) * 0.55;
      sh.setAttribute('fill', '#000'); sh.setAttribute('opacity', alpha.toFixed(3));
      sh.setAttribute('pointer-events', 'none');
      container.appendChild(sh);
    }

    const edge = document.createElementNS(SVG_NS, 'polygon');
    edge.setAttribute('points', points);
    edge.setAttribute('fill', 'none');
    edge.setAttribute('stroke', face.isAlu ? 'rgba(80,85,92,0.55)' : 'rgba(170,175,182,0.42)');
    edge.setAttribute('stroke-width', face.isAlu ? '0.5' : '0.4');
    edge.setAttribute('stroke-linejoin', 'miter');
    edge.setAttribute('pointer-events', 'none');
    container.appendChild(edge);

    // Company name on back fascia
    if (face.isFascia === 'back') {
      const midX = 0, midY_world = BH + FH/2, midZ_world = EX*0.16;
      const halfW = Math.min(BW * 0.42, 2.2);
      const midL = [-halfW, midY_world, midZ_world];
      const midR = [ halfW, midY_world, midZ_world];
      const mid  = [    0,  midY_world, midZ_world];
      const pL = project(midL), pR = project(midR), pM = project(mid);
      if (pL && pR && pM) {
        const frameL  = project([-halfW*1.08, BH + FH*0.18, EX*0.155]);
        const frameR  = project([ halfW*1.08, BH + FH*0.18, EX*0.155]);
        const frameLT = project([-halfW*1.08, BH + FH*0.82, EX*0.155]);
        const frameRT = project([ halfW*1.08, BH + FH*0.82, EX*0.155]);
        if (frameL && frameR && frameLT && frameRT) {
          const inset = document.createElementNS(SVG_NS, 'polygon');
          inset.setAttribute('points',
            `${frameL.x},${frameL.y} ${frameR.x},${frameR.y} ${frameRT.x},${frameRT.y} ${frameLT.x},${frameLT.y}`);
          inset.setAttribute('fill', '#fbfcfd');
          inset.setAttribute('stroke', 'rgba(120,124,130,0.45)');
          inset.setAttribute('stroke-width', '0.6');
          inset.setAttribute('pointer-events', 'none');
          container.appendChild(inset);
        }
        const fascH = Math.abs(pL.y - (project([-halfW, BH, EX*0.16]) || pL).y);
        const fontSize = Math.max(8, Math.min(22, fascH * 0.42));
        const t = document.createElementNS(SVG_NS, 'text');
        t.setAttribute('x', pM.x); t.setAttribute('y', pM.y + 5);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('fill', '#23262c');
        t.setAttribute('font-family', 'Inter, system-ui, sans-serif');
        t.setAttribute('font-size', fontSize.toFixed(1));
        t.setAttribute('font-weight', '600');
        t.setAttribute('letter-spacing', '0.04em');
        t.textContent = COMPANY_NAME;
        t.setAttribute('pointer-events', 'none');
        container.appendChild(t);
      }
    }
  }

  // Selection highlight
  if (selectedKey) {
    for (const face of sorted) {
      if (face.partId !== selectedKey) continue;
      const proj = face.pts.map(project);
      if (proj.some(p=>!p)) continue;
      if (face.normal) {
        const camDir = norm(sub(face.pts[0], cam));
        if (dot(face.normal, camDir) > 0.08) continue;
      }
      const points = proj.map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
      const sel = document.createElementNS(SVG_NS, 'polygon');
      sel.setAttribute('points', points);
      sel.setAttribute('fill', 'rgba(91,140,255,0.18)');
      sel.setAttribute('stroke', '#3a6dd9'); sel.setAttribute('stroke-width', '1.4');
      sel.setAttribute('pointer-events', 'none');
      container.appendChild(sel);
    }
  }
}

// ── Interaction ───────────────────────────────────────────────────────────────
const svgEl = document.getElementById('scene');
let dragging = false, lastX = 0, lastY = 0, didDrag = false;
svgEl.style.cursor = 'grab';
const pointers = new Map();
let pinchPrev = 0;

svgEl.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  svgEl.setPointerCapture(e.pointerId);
  didDrag = false;
  if (pointers.size === 1) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    svgEl.style.cursor = 'grabbing';
  } else if (pointers.size === 2) {
    dragging = false;
    const p = [...pointers.values()];
    pinchPrev = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
  }
});

svgEl.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const p = [...pointers.values()];
    const dist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    if (pinchPrev > 0) {
      const f = pinchPrev / dist;
      camState.distance = Math.max(7, Math.min(28, camState.distance * f));
    }
    pinchPrev = dist;
    updateCamera(); renderAll(); return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) didDrag = true;
  lastX = e.clientX; lastY = e.clientY;
  camState.azimuth   -= dx * 0.005;
  camState.elevation += dy * 0.0035;
  camState.elevation  = Math.max(-0.1, Math.min(1.35, camState.elevation));
  updateCamera(); renderAll();
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchPrev = 0;
  if (pointers.size === 0) { dragging = false; svgEl.style.cursor = 'grab'; }
}

svgEl.addEventListener('pointerup', (e) => {
  if (!didDrag && e.target.tagName === 'polygon' && e.target.getAttribute('data-pid')) {
    const pid = e.target.getAttribute('data-pid');
    selectedKey = selectedKey === pid ? null : pid;
    document.getElementById('sel-label').textContent = selectedKey ? e.target.getAttribute('data-label') : '—';
    document.getElementById('sel-meta').textContent  = selectedKey ? e.target.getAttribute('data-meta')  : '';
    document.getElementById('sel-card').style.display = selectedKey ? 'block' : 'none';
    renderAll();
  } else if (!didDrag && e.target.tagName === 'svg' && selectedKey) {
    selectedKey = null;
    document.getElementById('sel-card').style.display = 'none';
    renderAll();
  }
  endPointer(e);
});
svgEl.addEventListener('pointercancel', endPointer);
svgEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = e.deltaY > 0 ? 1.08 : 0.93;
  camState.distance = Math.max(7, Math.min(28, camState.distance * f));
  updateCamera(); renderAll();
}, { passive: false });

// ── View preset buttons ───────────────────────────────────────────────────────
function animateTo(target, ms = 600) {
  const start = { azimuth: camState.azimuth, elevation: camState.elevation, distance: camState.distance };
  const startT = performance.now();
  let dAz = target.azimuth - start.azimuth;
  while (dAz >  Math.PI) dAz -= Math.PI * 2;
  while (dAz < -Math.PI) dAz += Math.PI * 2;
  function step(t) {
    const k = Math.min(1, (t - startT) / ms);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    camState.azimuth   = start.azimuth + dAz * e;
    camState.elevation = start.elevation + (target.elevation - start.elevation) * e;
    camState.distance  = start.distance + (target.distance - start.distance) * e;
    updateCamera(); renderAll();
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// Sync button active state to initial columnStyle param
document.querySelectorAll('#profile-toolbar button[data-prof]').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.prof === columnStyle);
  btn.addEventListener('click', () => {
    if (btn.classList.contains('active')) return;
    document.querySelectorAll('#profile-toolbar button[data-prof]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    columnStyle = btn.dataset.prof;
    buildBoothGeometry(); renderAll();
  });
});

// ── HUD text update ───────────────────────────────────────────────────────────
function updateHud() {
  let az = (camState.azimuth * 180 / Math.PI) % 360;
  if (az < 0) az += 360;
  document.getElementById('cam-az').textContent = Math.round(az) + '°';
  document.getElementById('hud-dims').textContent = BW.toFixed(1) + ' × ' + BD.toFixed(1) + ' m';
  document.getElementById('hud-height').textContent = (BH + FH).toFixed(2) + ' m total';
  document.getElementById('hud-system').textContent = columnStyle === 'maxima' ? 'Maxima' : 'Octanorm';
  // Determine booth type from open sides
  const openCount = [!wallsVisible.back,!wallsVisible.left,!wallsVisible.right,!wallsVisible.front].filter(Boolean).length;
  const typeMap = ['Enclosed','Corner','Island'];
  document.getElementById('hud-type').textContent = openCount >= 3 ? 'Island' : openCount === 2 ? 'Corner' : openCount === 1 ? 'Open Side' : 'Enclosed';
}

// ── Dimension annotations (screen-space) ─────────────────────────────────────
function placeAnnotations() {
  const svg = document.getElementById('scene');
  const rect = svg.getBoundingClientRect();
  function toScreen(p) {
    return { x: rect.left + (p.x / VW) * rect.width, y: rect.top + (p.y / VH) * rect.height };
  }
  const wA = project([-BW/2, 0, 0.35]);
  const wB = project([ BW/2, 0, 0.35]);
  const dimW = document.getElementById('dim-w');
  dimW.querySelector('.lbl').textContent = BW.toFixed(1) + ' m';
  if (wA && wB) {
    const cx=(wA.x+wB.x)/2, cy=(wA.y+wB.y)/2+18;
    const s=toScreen({x:cx,y:cy});
    dimW.style.left=(s.x-22)+'px'; dimW.style.top=s.y+'px'; dimW.style.opacity='1';
  }
  const dA = project([BW/2+0.4, 0, 0]);
  const dB = project([BW/2+0.4, 0, BD]);
  const dimD = document.getElementById('dim-d');
  dimD.querySelector('.lbl').textContent = BD.toFixed(1) + ' m';
  if (dA && dB) {
    const cx=(dA.x+dB.x)/2, cy=(dA.y+dB.y)/2;
    const s=toScreen({x:cx,y:cy});
    dimD.style.left=s.x+'px'; dimD.style.top=(s.y-8)+'px'; dimD.style.opacity='1';
  }
  const hA = project([-BW/2-0.45, 0,      0]);
  const hB = project([-BW/2-0.45, BH+FH,  0]);
  const dimH = document.getElementById('dim-h');
  dimH.querySelector('.lbl').textContent = (BH+FH).toFixed(2) + ' m';
  if (hA && hB) {
    const cx=(hA.x+hB.x)/2, cy=(hA.y+hB.y)/2;
    const s=toScreen({x:cx,y:cy});
    dimH.style.left=(s.x-46)+'px'; dimH.style.top=(s.y-8)+'px'; dimH.style.opacity='1';
  }
}

window.addEventListener('resize', renderAll);

// ── Live config via postMessage ───────────────────────────────────────────────
window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'boothUpdate') return;
  const d = e.data;
  if (d.w      != null) BW = Math.max(1, parseFloat(d.w));
  if (d.d      != null) BD = Math.max(1, parseFloat(d.d));
  if (d.h      != null) BH = Math.max(0.8, parseFloat(d.h));
  if (d.name   != null) COMPANY_NAME = String(d.name);
  if (d.carpet != null) CARPET_COLOR = String(d.carpet);
  if (d.style != null) {
    columnStyle = d.style === 'maxima' ? 'maxima' : 'octa';
    document.querySelectorAll('#profile-toolbar button[data-prof]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.prof === columnStyle);
    });
  }
  PANELS_BACK = Math.max(1, Math.round(BW));
  PANELS_SIDE = Math.max(1, Math.round(BD));
  if (d.open != null) {
    const open = new Set(String(d.open).split(',').map(s=>s.trim()).filter(Boolean));
    wallsVisible = {
      back:  !open.has('back'),
      left:  !open.has('left'),
      right: !open.has('right'),
      front: !open.has('front'),
    };
  }
  // Smoothly re-center camera on the new booth size
  camState.target = defaultTarget();
  updateCamera();
  buildBoothGeometry();
  renderAll();
});
</script>
</body>
</html>
