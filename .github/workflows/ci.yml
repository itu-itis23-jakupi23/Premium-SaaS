name: CI

# Runs on every branch, not just main.
#
# Restricting push builds to main/master meant feature branches were never
# validated: work could sit for dozens of commits with typecheck, lint, tests,
# both portal builds and every release gate unverified, and problems only
# surfaced once they had already reached the default branch. The jobs need no
# secrets - Postgres comes from a service container - so they run anywhere.
on:
  push:
  pull_request:

jobs:
  verify:
    name: Typecheck, Smoke, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run security:audit

      - name: Scan repository for committed secrets
        run: pnpm run security:secrets

      - name: Validate deployment wiring
        run: pnpm run deployment:preflight

      - name: Lint production source
        run: pnpm run lint

      # The public marketing surface is not covered by the authenticated
      # Playwright specs, so without these two gates a pull request can break
      # social metadata, browser zoom, or a legal route and CI stays green.
      - name: Check public metadata (zoom, social preview)
        run: pnpm run public:metadata

      - name: Check public routes and link integrity
        run: pnpm run public:routes

      # WS-03: the iframe renderer duplicates snapping rules as inline
      # arithmetic and cannot import the shared module, so CI asserts the two
      # still encode the same numbers.
      - name: Check workspace transform constants
        run: pnpm run workspace:transform

      - name: Typecheck libraries
        run: pnpm run typecheck

      - name: Typecheck ENS app
        run: pnpm --filter @workspace/ens-landing run typecheck

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Run ENS app unit tests
        run: pnpm --filter @workspace/ens-landing run test

      - name: Start ENS API
        working-directory: artifacts/ens-landing
        env:
          NODE_ENV: development
          PORT: 5000
          VITE_USE_MOCK_API: "false"
          VITE_USE_REAL_CORE: "true"
          VITE_USE_REAL_MESSAGES: "true"
        run: |
          pnpm exec tsx server/index.ts > ens-api-ci.out.log 2> ens-api-ci.err.log &
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ens-api-ci.err.log
          exit 1

      - name: Smoke workflow
        working-directory: artifacts/ens-landing
        env:
          API_BASE_URL: http://localhost:5000/api
        run: pnpm run smoke:workflow

      - name: Build staff portal
        working-directory: artifacts/ens-landing
        run: pnpm run build:staff

      - name: Build client portal
        working-directory: artifacts/ens-landing
        run: pnpm run build:client

      - name: Enforce frontend performance budgets
        run: pnpm run performance:budgets

      # AX-06: asserts against built output, so it must follow the builds.
      - name: Check no unfinished controls shipped
        run: pnpm run ui:unfinished

  playwright:
    name: Playwright browser tests (production backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ens_e2e
          POSTGRES_USER: ens_e2e
          POSTGRES_PASSWORD: ens_e2e_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ens_e2e -d ens_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ens_e2e:ens_e2e_pass@localhost:5432/ens_e2e
      ALLOW_DISPOSABLE_DATABASE_TEST: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: artifacts/ens-landing
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated production Playwright release suite
        run: pnpm run e2e:release

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/ens-landing/playwright-report/
          retention-days: 7

  verify-api-server:
    name: api-server build + smoke test (production backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # api-server is the production backend (see docker-compose.yml) — it's a
    # separate codebase from artifacts/ens-landing/server, which only runs in
    # local dev. CI must verify both independently or production-only bugs
    # ship undetected.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ens_ci
          POSTGRES_USER: ens_ci
          POSTGRES_PASSWORD: ens_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ens_ci -d ens_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ens_ci:ens_ci_password@localhost:5432/ens_ci
      # Exercise the production build against CI-local HTTP and storage. Strict
      # cloud production configuration is covered by the env preflight tests.
      DEPLOYMENT_ENV: local
      MESSAGE_ENCRYPTION_KEY: ci-test-message-encryption-key-not-for-production
      APP_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Validate migration journal
        run: pnpm run db:check-journal

      - name: Verify clean and interrupted database migrations
        run: pnpm run db:verify-migrations

      - name: Apply migrations to CI database
        working-directory: lib/db
        run: pnpm run migrate

      - name: Test api-server (Zod schemas + integration tests)
        working-directory: artifacts/api-server
        env:
          AUTH_SECRET: ci-test-secret-not-for-production-use-only-ci
          STAFF_SIGNUP_KEY: ci-test-staff-key
        run: pnpm run test

      - name: Test lib/api-zod (Zod schema unit tests)
        working-directory: lib/api-zod
        run: pnpm run test

      - name: Build api-server
        working-directory: artifacts/api-server
        run: pnpm run build

      - name: Verify durable uploads across API restart
        env:
          UPLOAD_PERSISTENCE_SKIP_BUILD: "1"
          ALLOW_DISPOSABLE_DATABASE_TEST: "1"
        run: pnpm run storage:verify-restart

      - name: Start api-server
        working-directory: artifacts/api-server
        env:
          NODE_ENV: production
          PORT: 5000
          AUTH_SECRET: ci-test-secret-not-for-production-use-only-ci
          STAFF_SIGNUP_KEY: ci-test-staff-key
        run: |
          node --enable-source-maps dist/index.mjs > api-server-ci.out.log 2> api-server-ci.err.log &
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/healthz/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "--- stdout ---"; cat api-server-ci.out.log
          echo "--- stderr ---"; cat api-server-ci.err.log
          exit 1

      - name: Smoke workflow against production api-server
        working-directory: artifacts/ens-landing
        env:
          API_BASE_URL: http://localhost:5000/api
          STAFF_SIGNUP_KEY: ci-test-staff-key
        # Steps run under `bash -eo pipefail`, so a bare failing command aborts
        # the step before any diagnostic can run. Guarding the call with `if !`
        # suppresses errexit for it, so the server logs are actually printed on
        # the failure they exist to explain.
        run: |
          if ! node scripts/smoke-workflow.mjs; then
            echo "--- api-server stdout ---"; cat ../api-server/api-server-ci.out.log
            echo "--- api-server stderr ---"; cat ../api-server/api-server-ci.err.log
            exit 1
          fi

      - name: Verify database backup and restore
        env:
          ALLOW_DISPOSABLE_DATABASE_TEST: "1"
        run: pnpm run db:verify-backup
