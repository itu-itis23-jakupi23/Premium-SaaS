services:
  postgres:
    image: postgres:17-alpine
    container_name: ens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ens
      POSTGRES_USER: ens_app
      POSTGRES_PASSWORD: ens_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ens_app -d ens"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: ens-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgres://ens_app:ens_dev_password@postgres:5432/ens
      APP_URL: http://localhost
      CORS_ORIGIN: http://localhost
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set — generate with: openssl rand -base64 64}
      STAFF_SIGNUP_KEY: ${STAFF_SIGNUP_KEY:?STAFF_SIGNUP_KEY must be set to gate staff/chief signup}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-ENS Agency <noreply@ens.example.com>}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/healthz/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: artifacts/ens-landing/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: ens-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health.txt || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ens_postgres_data:
