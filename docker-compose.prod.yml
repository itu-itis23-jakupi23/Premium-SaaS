services:
  api:
    environment:
      DEPLOYMENT_ENV: production
      APP_URL: "${APP_URL:?APP_URL must be the public HTTPS staff URL}"
      CORS_ORIGIN: "${CORS_ORIGIN:?CORS_ORIGIN must list the allowed HTTPS portal origins}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      COOKIE_SECURE: "true"
      API_JSON_LIMIT: "${API_JSON_LIMIT:-75mb}"
      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY must be set}"
      RESEND_FROM: "${RESEND_FROM:?RESEND_FROM must be set}"
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:?STORAGE_PROVIDER must be local or s3}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:-}"
      STORAGE_REGION: "${STORAGE_REGION:-us-east-1}"
      STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-}"
      STORAGE_ACCESS_KEY_ID: "${STORAGE_ACCESS_KEY_ID:-}"
      STORAGE_SECRET_ACCESS_KEY: "${STORAGE_SECRET_ACCESS_KEY:-}"
      SEED_DEMO_DATA: "false"

  frontend:
    ports:
      - "${FRONTEND_PORT:-80}:80"
